name: Check Silex
on: [push, pull_request]
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          # Native checks use the bundled CPU runtime; no CUDA download is needed.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test
      - run: node scripts/prepare-model.mjs --native
      - run: node scripts/check-meaning-model.mjs
      - run: npm run build
